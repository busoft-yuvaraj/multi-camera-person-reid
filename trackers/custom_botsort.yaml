# BoT-SORT tracker customized for low-confidence detections
tracker_type: botsort
track_high_thresh: 0.15 
track_low_thresh: 0.05 
new_track_thresh: 0.15 
track_buffer: 200 
match_thresh: 0.8 
fuse_score: True 

# BoT-SORT specifics
gmc_method: sparseOptFlow 

# ReID model related thresh (Ultralytics defaults required for it to not crash)
proximity_thresh: 0.5 
appearance_thresh: 0.8 
with_reid: False 
model: auto
