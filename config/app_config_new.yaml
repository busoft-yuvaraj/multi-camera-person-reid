# ============================================================
# PHASE 1 CONFIGURATION: NEW SAMPLES (cctv_samples/new/)
# ============================================================

cameras:
  waiting_lobby:
    camera_id: "waiting_lobby"
    zone: "waiting_lobby"
    video_path: "D:/cctv_samples/test8/waitinglobby.mp4"
    roi:
      monitored:
        enabled: true
        type: "polygon"
        points:
          - [319, 0]
          - [708, 0]
          - [708, 581]
          - [319, 581]
    transitions:
      lobby_yellow:
        enabled: true
        type: "line"
        points:
          start: [338, 52]
          end: [357, 546]
        directions:
          SIDE_B_TO_SIDE_A: ["pantry", "passage"]
          SIDE_A_TO_SIDE_B: ["waiting_lobby"]
        candidate_destinations:
          - "pantry"
          - "passage"
        target_camera: "pantry"
        target_zone: "pantry"

  pantry:
    camera_id: "pantry"
    zone: "pantry"
    video_path: "D:/cctv_samples/test8/pantry.mp4"
    crop: [0, 0, 720, 720]
    roi:
      sink:
        enabled: true
        type: "polygon"
        points:
          - [31, 17]
          - [528, 5]
          - [530, 521]
          - [49, 532]
      monitored:
        enabled: true
        type: "polygon"
        points:
          - [0, 0]
          - [720, 0]
          - [720, 720]
          - [0, 720]
    transitions:
      pantry_yellow:
        enabled: true
        type: "line"
        points:
          start: [523, 152]
          end: [526, 417]
        directions:
          SIDE_A_TO_SIDE_B: ["waiting_lobby"]
          SIDE_B_TO_SIDE_A: ["pantry"]
        candidate_destinations:
          - "waiting_lobby"
        target_camera: "waiting_lobby"
        target_zone: "waiting_lobby"
      pantry_green:
        enabled: true
        type: "line"
        points:
          start: [65, 502]
          end: [530, 490]
        directions:
          SIDE_B_TO_SIDE_A: ["passage"]
          SIDE_A_TO_SIDE_B: ["pantry"]
        candidate_destinations:
          - "passage"
        target_camera: "passage"
        target_zone: "passage"

  passage:
    camera_id: "passage"
    zone: "passage"
    video_path: "D:/cctv_samples/test8/passage1.mp4"
    roi:
      monitored:
        enabled: true
        type: "polygon"
        points:
          - [503, 267]
          - [795, 267]
          - [795, 615]
          - [503, 615]
    transitions:
      passage_green:
        enabled: true
        type: "line"
        points:
          start: [576, 386]
          end: [743, 386]
        directions:
          SIDE_B_TO_SIDE_A: ["passage", "workspace"]
          SIDE_A_TO_SIDE_B: ["pantry", "waiting_lobby"]
        candidate_destinations:
          - "pantry"
          - "waiting_lobby"
        target_camera: "pantry"
        target_zone: "pantry"

# ============================================================
# CAMERA TOPOLOGY & TRANSITION RULES
# ============================================================

topology:
  pantry:
    next_zones:
      - waiting_lobby
      - passage
  waiting_lobby:
    next_zones:
      - pantry
      - passage
  passage:
    next_zones:
      - pantry
      - waiting_lobby
      - workspace
  workspace:
    next_zones:
      - passage

transition_rules:
  - from_camera: "pantry"
    transition: "pantry_yellow"
    direction: "SIDE_A_TO_SIDE_B"
    candidate_zones:
      - "waiting_lobby"
  - from_camera: "pantry"
    transition: "pantry_yellow"
    direction: "SIDE_B_TO_SIDE_A"
    candidate_zones:
      - "pantry"
  - from_camera: "pantry"
    transition: "pantry_green"
    direction: "SIDE_B_TO_SIDE_A"
    candidate_zones:
      - "passage"
  - from_camera: "pantry"
    transition: "pantry_green"
    direction: "SIDE_A_TO_SIDE_B"
    candidate_zones:
      - "pantry"
  - from_camera: "waiting_lobby"
    transition: "lobby_yellow"
    direction: "SIDE_B_TO_SIDE_A"
    candidate_zones:
      - "pantry"
      - "passage"
  - from_camera: "waiting_lobby"
    transition: "lobby_yellow"
    direction: "SIDE_A_TO_SIDE_B"
    candidate_zones:
      - "waiting_lobby"
  - from_camera: "passage"
    transition: "passage_green"
    direction: "SIDE_A_TO_SIDE_B"
    candidate_zones:
      - "pantry"
      - "waiting_lobby"
  - from_camera: "passage"
    transition: "passage_green"
    direction: "SIDE_B_TO_SIDE_A"
    candidate_zones:
      - "passage"
      - "workspace"

# ============================================================
# TEMPORAL CONSTRAINTS
# ============================================================

temporal_constraints:
  overlapping_camera_pairs:
    - ["pantry", "waiting_lobby"]
    - ["pantry", "passage"]
    - ["waiting_lobby", "passage"]
  pantry_to_waiting_lobby:
    min_seconds: 0.5
    max_seconds: 45.0
  waiting_lobby_to_pantry:
    min_seconds: 0.5
    max_seconds: 45.0
  pantry_to_passage:
    min_seconds: 0.5
    max_seconds: 45.0
  passage_to_pantry:
    min_seconds: 0.5
    max_seconds: 45.0
  waiting_lobby_to_passage:
    min_seconds: 0.5
    max_seconds: 45.0
  passage_to_waiting_lobby:
    min_seconds: 0.5
    max_seconds: 45.0
  passage_to_workspace:
    min_seconds: 0.5
    max_seconds: 45.0
  workspace_to_passage:
    min_seconds: 0.5
    max_seconds: 45.0
  same_camera_reacquisition_max_seconds: 60.0

# ============================================================
# DETECTION / TRACKING
# ============================================================

model_path: "yolo11n.pt"
tracker_config: "botsort.yaml"
detection_confidence: 0.25
imgsz: 960
track_buffer: 200

# ============================================================
# REID & EMBEDDING BANK
# ============================================================

reid_enabled: true
reid_model_path: "osnet_x1_0"
reid_interval: 3
min_reid_confidence: 0.35
min_reid_width: 45
min_reid_height: 90
reid_min_quality: 0.45
blur_threshold: 10.0

reid_similarity_threshold: 0.70
reid_bank_size: 15
embedding_diversity_threshold: 0.90
reid_confirm_frames: 3

# ============================================================
# REID PERSON MASKING (BACKGROUND SUPPRESSION)
# ============================================================

reid_masking:
  enabled: true
  model_path: "models/yolo11n-seg.pt"
  imgsz: 160
  bg_fill: [128, 128, 128]
  mask_reuse_frames: 6
  draw_outline: true

# ============================================================
# GLOBAL ID MATCHING & HYSTERESIS
# ============================================================

lock_confirmed_id: true
weight_reid: 0.80
weight_par: 0.15
weight_context: 0.05

threshold_match: 0.70
threshold_ambiguous: 0.60
threshold_cross_view: 0.55
threshold_recovery: 0.65
reid_ambiguous_margin: 0.04

pending_confirm_frames: 3
reid_new_id_confirm_frames: 15
gallery_update_min_quality: 0.60
track_lost_frames: 60
occlusion_buffer_frames: 20

hysteresis_switch_threshold: 0.92
hysteresis_switch_margin: 0.12
hysteresis_consecutive_frames: 10

# Cooldown and debounce for transitions & ROIs
transition_cooldown_frames: 15
roi_debounce_frames: 3

# ============================================================
# MODELS (PAR, POSE, ATTIRE)
# ============================================================

pose_model_path: "models/yolo11n-pose.pt"
par_model_path: "models/mobilenet_par.pt"
attire_model_path: "models/formal_attire_best.pt"
attire_detection_enabled: false
attire_conf_threshold: 0.40
attire_interval: 5

# ============================================================
# QDRANT (Credentials loaded from .env)
# ============================================================

qdrant_collection: "cctv-poc"
clear_gallery_on_start: true

# ============================================================
# OUTPUT & LOGS
# ============================================================

combined_output: "D:/output/combined_output_new.mp4"
enable_debug_logging: true
journey_log_path: "logs/journey.jsonl"
association_log_path: "logs/association_decisions.jsonl"

# ============================================================
# EXCLUSION ZONES
# ============================================================

exclusion_zones:
  waiting_lobby:
    - [0.70, 0.0, 1.0, 1.0]

# ============================================================
# PHASE 2 MODULES (Disabled in Phase 1)
# ============================================================

phase1_mode: true

handwashing:
  enabled: false
  sink_model_path: "models/yolo11n(best).pt"
  hand_model_path: "models/yolo_11n(best).pt"
  step_model_path: "models/sink_model(best).pt"

violation_detection:
  enabled: false
  evidence:
    enabled: false
